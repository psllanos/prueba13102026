# openspec/config.yaml — SDD project config (generated by sdd-init on 2026-10-13)
schema: spec-driven

# Artifact store declared by this workspace.
# NOTE: gentle-ai 4.1.1 on this machine exposes no `sdd-status` / `sdd-continue`
# command, so the native dispatcher could not validate this key. Re-verify after
# a gentle-ai upgrade that ships the SDD engine.
artifact_store: hybrid

# Top-level flag read by sdd-apply ("strict_tdd + testing section") and by the
# SDD orchestrator section.
# MUST stay in sync with rules.apply.tdd below — they are the same decision.
strict_tdd: false

context: |
  Greenfield repository: no commits, zero project markers on disk.
  Target system (declared intent, not yet present): vehicle-assistance provider assignment.
  Declared stack: .NET 8 service ProviderOptimizerService, React client, PostgreSQL (Neon),
  Docker + Docker Compose, GitHub Actions CI/CD, AWS (design only, no real deployment).
  Architecture target: microservices, DDD, Clean/Hexagonal.
  Required deliverable checks: unit tests plus at least one integration test.

# Discovered project roots and their own commands.
# Empty on purpose: discovery found zero project markers (no package.json, go.mod,
# pyproject.toml, Cargo.toml, or *.sln/*.csproj) in this workspace.
projects: []

testing:
  strict_tdd: false
  detected: "2026-10-13"
  fallback_reason: >-
    Zero project roots discovered and no explicit workspace-level test command exists.
    Fail-closed per the no-runner fallback. Re-run sdd-init after ProviderOptimizerService
    and its test projects exist to re-evaluate.
  projects: []
  test_layers: []
  coverage: []
  quality_tools: []

rules:
  proposal:
    - Include rollback plan for risky changes
    - State the provider-assignment scenario steps the change covers
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Respect the Clean Architecture dependency rule: inner layers never depend on outer layers
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

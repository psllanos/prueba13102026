name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  IMAGE_NAME: provider-optimizer

jobs:
  # ---------------------------------------------------------------------------------------------
  # Lint, build and test. Runs on every push and every pull request.
  # ---------------------------------------------------------------------------------------------
  build-and-test:
    name: build, lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ProviderOptimizer.sln

      # Formatting is a decision made once by the formatter, not re-litigated in every review.
      # --verify-no-changes fails the build instead of silently rewriting files.
      - name: Lint (format check)
        run: dotnet format ProviderOptimizer.sln --verify-no-changes --no-restore --verbosity diagnostic

      # Warnings are errors: a nullable warning or an unused variable must not reach main.
      - name: Build
        run: >
          dotnet build ProviderOptimizer.sln
          --configuration Release
          --no-restore
          -warnaserror

      # The integration suite starts its own Postgres through Testcontainers, which the
      # ubuntu-latest image already provides.
      - name: Test
        run: >
          dotnet test ProviderOptimizer.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory ./artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/**/*.trx
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # Frontend (optional deliverable): typecheck, lint and production build.
  # ---------------------------------------------------------------------------------------------
  frontend:
    name: frontend typecheck, lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------------------------
  # Docker build. Proves the image builds from a clean checkout on every change, so a broken
  # Dockerfile is caught in CI and not at deploy time.
  # ---------------------------------------------------------------------------------------------
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cheap smoke test: the published image must actually start and expose its entrypoint.
      - name: Verify the image runs
        run: |
          docker run --rm --entrypoint dotnet ${{ env.IMAGE_NAME }}:${{ github.sha }} --info

  # ---------------------------------------------------------------------------------------------
  # OPTIONAL - push to Amazon ECR.
  #
  # The exercise asks only that this configuration be shown, not that it run. It is gated behind a
  # manual dispatch and behind the repository variables below, so it can never run by accident and
  # can never fail a normal PR. It is deliberately NOT wired to `push: main`.
  #
  # To enable: set repository variables AWS_REGION and ECR_REPOSITORY, and configure OIDC
  # (id-token: write) with an IAM role that trusts this repository. No static access keys.
  # ---------------------------------------------------------------------------------------------
  push-to-ecr:
    name: push to ECR (manual, optional)
    if: github.event_name == 'workflow_dispatch' && vars.ENABLE_ECR_PUSH == 'true'
    runs-on: ubuntu-latest
    needs: docker-build

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
